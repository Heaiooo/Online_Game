services:
  api:
    build: .
    container_name: online-game-api
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 mysite.asgi:application"
    expose:
      - "8000"

  polls:
    build: .
    container_name: online-game-polls
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    command: daphne -b 0.0.0.0 -p 8001 mysite.asgi:application
    expose:
      - "8001"

  nginx:
    image: nginx:alpine
    container_name: online-game-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - polls
